# ============================================================
# Build + publish the retriever sidecar image to GHCR.
#
# uap-api's prod stack pulls ghcr.io/seeeyeguy/uap-retriever:latest;
# this workflow keeps that image current. It only fires when the
# files baked into the image change (plus manual dispatch), because
# the build is heavy: CPU torch wheel + the bge-m3 model snapshot.
#
# Publishing here does NOT restart anything in production — the next
# uap-api deploy (or a manual deploy/deploy.sh run) picks it up.
# No secrets needed beyond the automatic GITHUB_TOKEN.
# ============================================================
name: retriever-image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile.retriever
      - requirements-retriever.txt
      - retriever.py
      - main.py
      - textqc.py
      - .github/workflows/retriever-image.yml
  workflow_dispatch: {}

concurrency:
  group: retriever-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.retriever
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/uap-retriever:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/uap-retriever:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
